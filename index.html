<!DOCTYPE html>
<html>
<head>
  <title>Village Search</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    input {
      padding: 10px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px auto;
      width: 60%;
      border-radius: 10px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
      text-align: left;
    }

    .label {
      font-weight: bold;
      color: #555;
    }
  </style>
</head>

<body>

<h1>Village Search</h1>

<input type="text" id="searchBox" placeholder="Enter village name">
<button onclick="searchVillage()">Search</button>

<div id="result"></div>

<script>
function searchVillage() {
  const name = document.getElementById("searchBox").value;

  fetch(`http://localhost:3000/search/${name}`)
    .then(res => res.json())
    .then(data => {
      let output = "";

      if (data.length === 0) {
        output = "<p>No results found</p>";
      }

      data.forEach(v => {
        output += `
          <div class="card">
            <p><span class="label">State:</span> ${v.state}</p>
            <p><span class="label">District:</span> ${v.district}</p>
            <p><span class="label">Sub District:</span> ${v.sub_district}</p>
            <p><span class="label">Village:</span> ${v.village}</p>
          </div>
        `;
      });

      document.getElementById("result").innerHTML = output;
    });
}
</script>

</body>
</html>
